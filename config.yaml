# Pomegranate Orchard Monitor — Configuration
# All paths are relative to project root

paths:
  yolo_weights: "pomegranate_models/yolov8_pomegranate.pt"
  unet_weights: "pomegranate_models/unet_defect.pth"
  results_dir: "results"
  figures_dir: "results/figures"
  metrics_dir: "results/metrics"
  test_images_dir: "test_images"

inference:
  device: "auto"  # auto | cuda | cpu
  yolo_conf_threshold: 0.25
  yolo_imgsz: 640
  unet_imgsz: 256
  unet_classes: 1
  unet_activation: "sigmoid"
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

classes:
  names:
    0: "crown_damaged"
    1: "crown_good"
    2: "surface_damaged"
    3: "surface_good"
    4: "surface_burnt"
    5: "surface_cracked"
  healthy: [1, 3]
  defective: [0, 2, 4, 5]
  colors:
    0: [255, 0, 0]      # red
    1: [0, 255, 0]      # green
    2: [255, 0, 0]      # red
    3: [0, 255, 0]      # green
    4: [255, 165, 0]    # orange
    5: [255, 0, 255]    # magenta

xai:
  faithfulness_top_percentile: 20
  cam_threshold: 0.5
  explainability_enabled: true

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

frontend:
  api_url: "http://localhost:8000"
  default_conf_threshold: 0.25
  default_mask_opacity: 0.4
  page_title: "Pomegranate Orchard Monitor"
