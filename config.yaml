# Orchard Fruit Monitor — Configuration
# All paths are relative to project root

paths:
  yolo_weights: "models/yolov8_apple.pt"
  unet_weights: "models/unet_fruit.pth"
  results_dir: "results"
  figures_dir: "results/figures"
  metrics_dir: "results/metrics"
  test_images_dir: "test_images"

inference:
  device: "auto"  # auto | cuda | cpu
  yolo_conf_threshold: 0.15
  yolo_imgsz: 640
  unet_imgsz: 256
  unet_classes: 1
  unet_activation: "sigmoid"
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

classes:
  names:
    0: "apple"
  colors:
    0: [0, 200, 0]      # green

xai:
  faithfulness_top_percentile: 20
  cam_threshold: 0.5
  explainability_enabled: true

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

frontend:
  api_url: "http://localhost:8000"
  default_conf_threshold: 0.15
  default_mask_opacity: 0.4
  page_title: "Orchard Fruit Monitor"
